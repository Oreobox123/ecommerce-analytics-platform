version: 2

models:
  - name: dim_products
    description: "Product dimension with English category translations"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_customers
    description: "Customer dimension"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Seller dimension"
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: "Calendar dimension"
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique

  - name: fact_order_items
    description: "Order-item level sales fact table"
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: monthly_sales
    description: "Monthly delivered-order sales summary"
    columns:
      - name: order_month
        data_tests:
          - not_null
          - unique

      - name: total_orders
        data_tests:
          - not_null

      - name: product_revenue
        data_tests:
          - not_null

      - name: shipping_charges
        data_tests:
          - not_null

      - name: total_order_value
        data_tests:
          - not_null

  - name: category_sales
    description: "Sales performance by product category for delivered orders"
    columns:
      - name: category
        data_tests:
          - not_null
          - unique

      - name: total_orders
        data_tests:
          - not_null

      - name: items_sold
        data_tests:
          - not_null

      - name: product_revenue
        data_tests:
          - not_null

      - name: shipping_charges
        data_tests:
          - not_null

      - name: total_order_value
        data_tests:
          - not_null

  - name: customer_metrics
    description: "Customer-level purchasing and spending metrics for delivered orders"
    columns:
      - name: customer_unique_id
        data_tests:
          - not_null
          - unique

      - name: total_orders
        data_tests:
          - not_null

      - name: total_items
        data_tests:
          - not_null

      - name: total_product_spending
        data_tests:
          - not_null

      - name: total_shipping_spending
        data_tests:
          - not_null

      - name: total_spending
        data_tests:
          - not_null

      - name: first_order_date
        data_tests:
          - not_null

      - name: last_order_date
        data_tests:
          - not_null

      - name: customer_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['One-time customer', 'Repeat customer']

  - name: seller_metrics
    description: "Seller-level sales performance for delivered orders"
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

      - name: total_orders
        data_tests:
          - not_null

      - name: items_sold
        data_tests:
          - not_null

      - name: product_revenue
        data_tests:
          - not_null

      - name: shipping_charges
        data_tests:
          - not_null

      - name: total_order_value
        data_tests:
          - not_null

      - name: avg_item_price
        data_tests:
          - not_null

  - name: state_sales
    description: "Sales performance by Brazilian customer state for delivered orders"
    columns:
      - name: customer_state
        data_tests:
          - not_null
          - unique

      - name: unique_customers
        data_tests:
          - not_null

      - name: total_orders
        data_tests:
          - not_null

      - name: items_sold
        data_tests:
          - not_null

      - name: product_revenue
        data_tests:
          - not_null

      - name: shipping_charges
        data_tests:
          - not_null

      - name: total_order_value
        data_tests:
          - not_null